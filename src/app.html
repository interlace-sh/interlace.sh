<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#09090b" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<!--
			Fonts are served from this origin (see static/fonts and the @font-face
			block in routes/layout.css). Google's stylesheet used to sit here and it
			was the single most expensive thing in the head: a render-blocking
			request to a third origin that had to resolve, connect and parse before
			the browser even learned which font file to fetch. Preloading the two
			latin subsets starts them in parallel with the CSS instead.
		-->
		<link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link
			rel="preload"
			href="/fonts/jetbrains-mono-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		%sveltekit.head%

		<!--
			Last in the head on purpose. It is async, so it never blocks the parser,
			but anything above it competes with the stylesheet and the module
			preloads for the first round of connections.
		-->
		<script async src="https://cdn.jsdelivr.net/npm/@d8a-tech/wt/dist/wt.min.js"></script>
		<script>
			window.d8aLayer = window.d8aLayer || [];
			window.d8a =
				window.d8a ||
				function () {
					d8aLayer.push(arguments);
				};
			d8a('js', new Date());
			d8a('config', '5cc1604e-4cda-475b-8bfb-e6eef275dc2e', {
				server_container_url: 'https://global.t.d8a.tech/5cc1604e-4cda-475b-8bfb-e6eef275dc2e/d/c'
			});
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
