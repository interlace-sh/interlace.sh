name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs proto, then every tool pinned in .prototools (moon, node, pnpm),
      # and caches ~/.proto between runs.
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          cache-base: master

      # moon installs node_modules via the pnpm toolchain before running the task.
      - run: moon run site:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
