# pnpm 11 no longer reads the `pnpm` field in package.json; settings live here.
#
# eslint-scope: svelte-eslint-parser still declares ^8.2.0, but ESLint 10 needs 9.x —
# on 8.x the whole lint run dies with "scopeManager.addGlobals is not a function".
# Drop this override only once svelte-eslint-parser widens its own range.
overrides:
  eslint-scope: ^9.1.1
  cookie: ^0.7.0

# vite-plugin-tailwind-autoreference has no release declaring vite 8 (0.2.4 is the
# latest and still says ^7.0.0), but it only touches the Svelte <style> transform and
# works unchanged on 8. Drop this once the plugin widens its own peer range.
peerDependencyRules:
  allowedVersions:
    'vite-plugin-tailwind-autoreference>vite': '8'
