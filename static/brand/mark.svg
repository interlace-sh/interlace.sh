<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Interlace">
  <title>Interlace</title>
  <!-- Inline build - the horizontal loop inherits currentColor. Paste into a
       component. Does NOT work via <img src> or as a favicon (currentColor becomes
       black) - use the on-dark / on-light files there.
       Two loops in plain weave. Each loop is knocked out by the other loop's own
       stroke at width 13 against the 6 drawn, so the 3.5 clearance follows the
       curve; the clip paths confine each cut to one crossing quadrant. All four
       crossings therefore show a gap. -->
  <defs>
    <mask id="ih" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g clip-path="url(#itl)"><rect x="20" y="6" width="24" height="52" rx="12" fill="none" stroke="#000" stroke-width="13"/></g>
      <g clip-path="url(#ibr)"><rect x="20" y="6" width="24" height="52" rx="12" fill="none" stroke="#000" stroke-width="13"/></g>
    </mask>
    <mask id="iv" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g clip-path="url(#itr)"><rect x="6" y="20" width="52" height="24" rx="12" fill="none" stroke="#000" stroke-width="13"/></g>
      <g clip-path="url(#ibl)"><rect x="6" y="20" width="52" height="24" rx="12" fill="none" stroke="#000" stroke-width="13"/></g>
    </mask>
    <clipPath id="itl"><rect x="10" y="10" width="18" height="18"/></clipPath>
    <clipPath id="ibr"><rect x="36" y="36" width="18" height="18"/></clipPath>
    <clipPath id="itr"><rect x="36" y="10" width="18" height="18"/></clipPath>
    <clipPath id="ibl"><rect x="10" y="36" width="18" height="18"/></clipPath>
  </defs>
  <rect x="6" y="20" width="52" height="24" rx="12" fill="none" stroke="currentColor" stroke-width="6" mask="url(#ih)"/>
  <rect x="20" y="6" width="24" height="52" rx="12" fill="none" stroke="#8B5CF6" stroke-width="6" mask="url(#iv)"/>
</svg>
