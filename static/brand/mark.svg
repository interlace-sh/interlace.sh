<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Interlace">
  <title>Interlace</title>
  <!-- Inline build - warp inherits currentColor. Paste into a component. Does NOT
       work via <img src> or as a favicon (currentColor becomes black) - use the
       on-dark / on-light files there.
       Two loops in plain weave. Each loop is knocked out where it passes UNDER
       the other, so every one of the four crossings shows a gap - the vertical
       loop goes under at top-right and bottom-left, the horizontal one at
       top-left and bottom-right. One geometry works from 16px up. -->
  <defs>
    <mask id="ah"><rect width="64" height="64" fill="#fff"/><rect x="10.5" y="10.5" width="15.0" height="15.0" fill="#000"/><rect x="38.5" y="38.5" width="15.0" height="15.0" fill="#000"/></mask>
    <mask id="av"><rect width="64" height="64" fill="#fff"/><rect x="38.5" y="10.5" width="15.0" height="15.0" fill="#000"/><rect x="10.5" y="38.5" width="15.0" height="15.0" fill="#000"/></mask>
  </defs>
  <rect x="5" y="18" width="54" height="28" rx="14" stroke="currentColor" stroke-width="8" mask="url(#ah)"/>
  <rect x="18" y="5" width="28" height="54" rx="14" stroke="#8B5CF6" stroke-width="8" mask="url(#av)"/>
</svg>
