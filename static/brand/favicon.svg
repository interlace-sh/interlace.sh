<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Interlace">
  <title>Interlace</title>
  <!-- Favicon. Browser chrome is dark far more often than not and the supplied pair
       reads at 10.5:1 there; it is the same file as mark-on-dark.
       Two loops in plain weave. Each loop is knocked out by the other loop's own
       stroke at width 13 against the 6 drawn, so the 3.5 clearance follows the
       curve; the clip paths confine each cut to one crossing quadrant. All four
       crossings therefore show a gap. -->
  <defs>
    <mask id="fh" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g clip-path="url(#ftl)"><rect x="20" y="6" width="24" height="52" rx="12" fill="none" stroke="#000" stroke-width="13"/></g>
      <g clip-path="url(#fbr)"><rect x="20" y="6" width="24" height="52" rx="12" fill="none" stroke="#000" stroke-width="13"/></g>
    </mask>
    <mask id="fv" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g clip-path="url(#ftr)"><rect x="6" y="20" width="52" height="24" rx="12" fill="none" stroke="#000" stroke-width="13"/></g>
      <g clip-path="url(#fbl)"><rect x="6" y="20" width="52" height="24" rx="12" fill="none" stroke="#000" stroke-width="13"/></g>
    </mask>
    <clipPath id="ftl"><rect x="10" y="10" width="18" height="18"/></clipPath>
    <clipPath id="fbr"><rect x="36" y="36" width="18" height="18"/></clipPath>
    <clipPath id="ftr"><rect x="36" y="10" width="18" height="18"/></clipPath>
    <clipPath id="fbl"><rect x="10" y="36" width="18" height="18"/></clipPath>
  </defs>
  <rect x="6" y="20" width="52" height="24" rx="12" fill="none" stroke="#8B5CF6" stroke-width="6" mask="url(#fh)"/>
  <rect x="20" y="6" width="24" height="52" rx="12" fill="none" stroke="#C4B5FD" stroke-width="6" mask="url(#fv)"/>
</svg>
